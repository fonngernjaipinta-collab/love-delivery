<style>
:root{--ink:#1c1c1e;--mute:#8a8a90;--line:#ececf0;--bg:#fff;--soft:#f6f6f8;--rose:#e4456b;--rose-s:#fdeef2;--ok:#2fa36b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:15px;line-height:1.5}
#app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 20px calc(110px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
h1{font-size:28px;font-weight:600;letter-spacing:-.01em;margin:0}
h2{font-size:13px;font-weight:500;color:var(--mute);margin:26px 0 4px}
.top{display:flex;justify-content:space-between;align-items:center;height:44px}
.logo{font-weight:600;font-size:17px}.logo i{color:var(--rose);font-style:normal}
.link{color:var(--mute);font-size:14px}
.hello{margin:18px 0 6px}.hello p{margin:4px 0 0;color:var(--mute)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin:18px 0 4px}
.seg button{flex:1;padding:8px;border-radius:10px;color:var(--mute);font-weight:500}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.badge{display:inline-block;background:var(--rose);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;margin-left:5px}
.row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.ic{color:var(--rose);flex:none;width:46px;height:46px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:22px}
.row .t{flex:1;min-width:0}.row b{font-weight:500;display:block}.row small{color:var(--mute);font-size:13px}
.qty{display:flex;align-items:center;gap:12px}.qty span{min-width:14px;text-align:center;font-weight:500}
.rb{width:32px;height:32px;border-radius:50%;background:var(--rose);color:#fff;font-size:18px;display:grid;place-items:center}
.rb.g{background:var(--soft);color:var(--ink)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.btn{display:block;width:100%;max-width:440px;margin:0 auto;padding:14px;border-radius:14px;background:var(--ink);color:#fff;font-weight:500;text-align:center}
.btn.rose{background:var(--rose)}.btn.line{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.login{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center}
.login .mark{color:var(--rose);width:72px;height:72px;margin:0 auto 6px;border-radius:22px;background:var(--rose-s);display:grid;place-items:center;font-size:34px}
.lb{text-align:left;font-size:13px;color:var(--mute);margin-bottom:-8px}
.login p{color:var(--mute);margin:0 0 14px}
.card{border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.card .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .h b{font-weight:600}.card .h small{color:var(--mute);white-space:nowrap}
.it{margin:8px 0 0;padding:0;list-style:none}.it li{display:flex;justify-content:space-between;padding:2px 0}
.note{margin-top:8px;padding:8px 12px;background:var(--soft);border-radius:10px;font-size:13px;color:var(--mute)}
.trk{display:flex;margin:16px 0 4px}
.s{flex:1;text-align:center;font-size:11px;color:var(--mute);position:relative}
.s::before{content:"";position:absolute;top:5px;left:-50%;width:100%;height:2px;background:var(--line)}
.s:first-child::before{display:none}
.s i{position:relative;display:block;width:12px;height:12px;border-radius:50%;background:var(--line);margin:0 auto 6px}
.s.d{color:var(--ink)}.s.d i,.s.d::before{background:var(--ok)}
.s.n{color:var(--rose);font-weight:500}.s.n i{background:var(--rose);box-shadow:0 0 0 4px var(--rose-s)}.s.n::before{background:var(--ok)}
.go{margin-top:12px;width:100%;padding:11px;border-radius:12px;background:var(--rose);color:#fff;font-weight:500}
.empty{text-align:center;color:var(--mute);padding:48px 0}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:9;animation:in .3s;max-width:90%;text-align:center}
@keyframes in{from{opacity:0;transform:translate(-50%,-12px)}}
.field{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;margin-top:8px;resize:none}
.mark svg,.ok svg{width:32px;height:32px}.done{text-align:center;padding:70px 0 20px}.done .ok{color:var(--rose);width:64px;height:64px;border-radius:50%;background:var(--rose-s);display:grid;place-items:center;margin:0 auto 18px;font-size:30px;animation:pop .5s}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.err{color:var(--rose);font-size:13px}
.promo{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--rose-s);color:var(--rose);font-weight:500}
.loy{margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px}
.row2{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.row2 small{color:var(--mute);text-align:right}
.pb{height:6px;border-radius:9px;background:var(--soft);margin-top:8px;overflow:hidden}.pb i{display:block;height:100%;background:var(--rose);border-radius:9px;transition:width .6s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{border:1px solid var(--line);border-radius:16px;padding:14px}.stat b{display:block;font-size:20px;font-weight:600}.stat small{color:var(--mute)}
.eta{margin-top:6px;color:var(--rose);font-size:13px;font-weight:500}
.sb{color:#d3d3da;padding:2px}.sb.on{color:var(--rose)}.sb.on svg{fill:currentColor}.sb svg{width:26px;height:26px}.stars{margin-top:8px}.stars .sb svg{width:18px;height:18px}
.rate{margin-top:12px;display:flex;justify-content:space-between;align-items:center;color:var(--mute)}
.rcpt{margin-top:12px;padding:14px;border:1px dashed var(--mute);border-radius:12px;font-size:13px}.r2{display:flex;justify-content:space-between;padding:2px 0}
.fh{position:fixed;bottom:22%;color:var(--rose);opacity:0;animation:fl 2s ease-out forwards;pointer-events:none;z-index:9}.fh svg{width:22px;height:22px;fill:currentColor}
@keyframes fl{20%{opacity:.8}to{opacity:0;transform:translateY(-220px)}}
.tks{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px}
.tk{flex:none;width:260px;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;background:var(--rose-s);border-radius:14px;-webkit-mask:radial-gradient(circle 8px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 8px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 8px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 8px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat}
.tk b{display:block;color:var(--rose)}.tk small{color:var(--mute);display:block}.tk button{flex:none;border-radius:99px;background:var(--rose);color:#fff;padding:6px 14px;font-weight:500}.tk.u{opacity:.45}.tk.u button{background:var(--mute);pointer-events:none}
.review-box{margin-top:12px;padding:12px;border-radius:13px;background:var(--soft)}
.review-box .stars{margin:0}
.review-text{margin-top:7px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.review-form{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:14px}
.review-form p{margin:0;color:var(--mute);font-size:13px}
.review-form .field{margin-top:8px}
.review-submit{margin-top:8px;width:100%;padding:10px;border-radius:11px;background:var(--rose);color:white}
.review-meta{font-size:12px;color:var(--mute);margin-top:5px}
.del-order{width:100%;margin-top:10px;padding:10px;border:1px solid #f3c5d0;border-radius:11px;color:var(--rose);font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

const ico=k=>`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]||""}</svg>`;
const CATS=["ทั้งหมด","ใกล้ชิด","เดท","บริการ","สิทธิพิเศษ"];
const ST=[["new","รับออเดอร์"],["prep","กำลังเตรียม"],["ship","กำลังจัดส่ง"],["done","ส่งถึงแล้ว"]];
const NEXT={new:"เริ่มเตรียม",prep:"ออกจัดส่ง",ship:"ส่งถึงแล้ว"};

const S={

 nick:(()=>{try{return localStorage.getItem("ld_nick")||""}catch(e){return""}})(),
 user:null,owner:false,cat:"ทั้งหมด",cart:{},orders:[],

 tab:"menu",otab:"open",first:true,err:"",push:false

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast=t=>{
 const e=document.createElement("div");
 e.className="toast";e.textContent=t;document.body.appendChild(e);
 setTimeout(()=>e.remove(),3200);
 try{navigator.vibrate&&navigator.vibrate(120)}catch(x){}
};

let unsub=null;
let messagingInstance=null;

/* ลงทะเบียนอุปกรณ์รับแจ้งเตือนของเจ้าของร้าน (silent=true คือไม่ขึ้นข้อความ ใช้ตอนต่ออายุ token อัตโนมัติ) */
async function enableOwnerPush(silent){
 const say=m=>{if(!silent)toast(m)};
 if(!S.owner||!S.user)return say("เฉพาะเจ้าของร้านเท่านั้น");
 try{
  if(!("Notification" in window)||!("serviceWorker" in navigator))
   return say("อุปกรณ์นี้ไม่รองรับการแจ้งเตือน (iPhone ต้องกด Add to Home Screen ก่อน)");
  const permission=silent?Notification.permission:await Notification.requestPermission();
  if(permission!=="granted")return say("กรุณาอนุญาตการแจ้งเตือนในการตั้งค่าอุปกรณ์");
  if(!(await isSupported()))return say("อุปกรณ์นี้ยังไม่รองรับ Firebase Push");
  say("กำลังตั้งค่าการแจ้งเตือน...");
  const swReg=await navigator.serviceWorker.register("firebase-messaging-sw.js");
  await navigator.serviceWorker.ready;
  messagingInstance=messagingInstance||getMessaging(app);
  const token=await getToken(messagingInstance,{vapidKey:VAPID_KEY,serviceWorkerRegistration:swReg});
  if(!token)throw new Error("ไม่สามารถสร้าง Notification Token ได้");
  await setDoc(doc(db,"ownerTokens",S.user.uid),{
   uid:S.user.uid,email:S.user.email,tokens:arrayUnion(token),updatedAt:Date.now()
  },{merge:true});
  S.push=true;
  say("เปิดรับการแจ้งเตือนเรียบร้อยแล้ว");
 }catch(e){
  console.error("Push notification error:",e);
  say("ตั้งค่าไม่สำเร็จ: "+(e.code||e.message||"Unknown error"));
 }
}

const stars=(value,id)=>[1,2,3,4,5].map(k=>`<button class="sb${k<=value?" on":""}" ${id?`data-r="${id}:${k}"`:"disabled"} aria-label="${k} ดาว">${ico("star")}</button>`).join("");

function hearts(){

function promoBox(){

 if(!S.cp.length)return "";
 return `<h2 style="margin-top:18px">คูปอง</h2><div class="tks">`+

function statsView(){
 const L=S.orders,done=L.filter(o=>o.status==="done").length,cnt={};
 let tot=0;
 L.forEach(o=>(o.items||[]).forEach(x=>{cnt[x.n]=(cnt[x.n]||0)+x.q;tot+=x.q}));
 const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];

onAuthStateChanged(auth,u=>{
 S.user=u;
 S.owner=!!u&&u.email&&u.email.toLowerCase()===OWNER_EMAIL.toLowerCase();
 if(unsub){unsub();unsub=null}
 S.orders=[];S.reviews={};S.first=true;

 if(u){
  const col=collection(db,"orders");
  const q=S.owner
   ?query(col,orderBy("ts","desc"),limit(80))
   :query(col,where("uid","==",u.uid));

  const u1=onSnapshot(q,snap=>{
   if(!S.first)snap.docChanges().forEach(ch=>{
    const d=ch.doc.data();
    if(S.owner&&ch.type==="added")ping("ออเดอร์ใหม่จาก "+d.name);
    if(!S.owner&&ch.type==="modified"&&!(ch.doc.metadata&&ch.doc.metadata.hasPendingWrites)){
     const s=ST.find(x=>x[0]===d.status);
     ping(d.reply&&S.rp[ch.doc.id]!==d.reply?"ฝน: "+d.reply:s?s[1]:"");
    }
   });
   S.first=false;
   snap.docs.forEach(x=>{S.rp[x.id]=x.data().reply});
   S.orders=snap.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>b.ts-a.ts);
   rr();
  },e=>{S.err="อ่านออเดอร์ไม่ได้: "+e.code;render()});

  const u2=onSnapshot(doc(db,"config","coupons"),s=>{
   S.cp=s.exists()?s.data().items||[]:[];rr();
  },()=>{});
  const u3=onSnapshot(doc(db,"config","menu"),s=>{
   S.menu=s.exists()?s.data().items:null;rr();
  },()=>{});

  const reviewCol=collection(db,"reviews");
  const reviewQuery=S.owner
   ?query(reviewCol,orderBy("ts","desc"),limit(200))
   :query(reviewCol,where("uid","==",u.uid));

  const u4=onSnapshot(reviewQuery,snap=>{
   const map={};
   snap.docs.forEach(x=>map[x.id]=x.data());
   S.reviews=map;
   rr();
  },e=>{
   console.error("Review listener:",e);
   S.err="อ่านรีวิวไม่ได้: "+e.code;
   render();
  });

  unsub=()=>{u1();u2();u3();u4()};

  /* ต่ออายุ token แจ้งเตือนของเจ้าของร้านอัตโนมัติ ถ้าเคยอนุญาตไว้แล้ว */
  S.push=false;
  if(S.owner&&"Notification" in window&&Notification.permission==="granted")enableOwnerPush(true);
 }
 render();
});

 document.getElementById("out").onclick=()=>signOut(auth);
 document.getElementById("bk").onclick=()=>{render()};

 document.getElementById("ok").onclick=async function(){
  this.disabled=true;
  try{
   const orderRef=doc(collection(db,"orders"));
   await setDoc(orderRef,{
    uid:S.user.uid,
    name:S.nick||(S.user.displayName||"").split(" ")[0]||"แฟน",
    items:its.map(m=>({n:m.n,e:m.e,q:S.cart[m.id]})),
    note:document.getElementById("note").value.trim(),
    coupons:cps.map(c=>({id:c.id,t:c.t})),
    status:"new",
    ts:Date.now(),
    num:Number(String(Date.now()).slice(-6))
   });

   S.cart={};S.cpc={};
   $.innerHTML=`<div class="done"><div class="ok">${ico("check")}</div><h1>กำลังจัดส่งความรัก</h1><p style="color:var(--mute)">เจ้าของร้านได้รับออเดอร์แล้ว</p></div><div class="bar"><button class="btn rose" id="tr">ดูสถานะออเดอร์</button></div>`;
   document.getElementById("tr").onclick=()=>{S.tab="orders";render()};
   hearts();
  }catch(e){
   toast("ส่งไม่สำเร็จ ("+e.code+")");
   this.disabled=false;
  }
 };
}
